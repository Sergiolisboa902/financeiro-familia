<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
    
    <!-- PWA & Mobile Optimization -->
    <meta name="mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
    <meta name="apple-mobile-web-app-title" content="Planeja+"/>
    <meta name="theme-color" content="#0f1923"/>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2454/2454291.png">
    
    <title>Planeja+ | Finanças Familiares</title>

    <!-- External Assets -->
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>

    <style>
        :root {
            --bg: #0f1923;
            --bg2: #162030;
            --bg3: #1e2d40;
            --card: #1a2a3a;
            --card2: #223344;
            --border: rgba(255, 255, 255, 0.07);
            --accent: #e8c96d;
            --income: #4ade80;
            --expense: #f87171;
            --warning: #fb923c;
            --text: #f0f4f8;
            --text2: #8fa3b8;
            --text3: #5a7a96;
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; overflow: hidden; }
        
        #app { display: flex; flex-direction: column; height: 100dvh; max-width: 430px; margin: 0 auto; overflow: hidden; }
        
        /* Header & Balance */
        .header { padding: calc(var(--safe-top) + 14px) 20px 12px; flex-shrink: 0; }
        .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
        .logo { font-family: 'DM Serif Display', serif; font-size: 24px; color: var(--accent); }
        .logo span { color: var(--text3); font-style: italic; font-size: 14px; margin-left: 5px; }
        
        .bal-card { 
            background: linear-gradient(135deg, var(--bg3) 0%, #1a3050 100%); 
            border: 1px solid var(--border); 
            border-radius: 20px; 
            padding: 18px; 
            position: relative; 
            overflow: hidden; 
        }
        .bal-label { font-size: 10px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--text3); margin-bottom: 4px; }
        .bal-value { font-family: 'DM Serif Display', serif; font-size: 34px; letter-spacing: -1px; margin-bottom: 12px; }
        .bal-value.neg { color: var(--expense); }
        
        .bal-row { display: flex; gap: 10px; }
        .bal-stat { flex: 1; background: rgba(255, 255, 255, .05); border-radius: 12px; padding: 10px; }
        .bal-stat-label { font-size: 9px; letter-spacing: 1px; text-transform: uppercase; color: var(--text3); margin-bottom: 3px; }
        .bal-stat-val { font-size: 14px; font-weight: 700; }
        .income { color: var(--income); }
        .expense { color: var(--expense); }

        /* Main Content */
        .main { flex: 1; overflow-y: auto; padding: 14px 20px; -webkit-overflow-scrolling: touch; }
        .main::-webkit-scrollbar { display: none; }

        /* Navigation */
        .bottom-nav { display: flex; padding: 6px 6px calc(var(--safe-bottom) + 6px); background: var(--bg2); border-top: 1px solid var(--border); flex-shrink: 0; }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; background: none; border: none; cursor: pointer; color: var(--text3); font-size: 10px; font-weight: 600; padding: 6px 0; transition: .2s; }
        .nav-item svg { width: 22px; height: 22px; }
        .nav-item.active { color: var(--accent); }
        .nav-fab { width: 48px; height: 48px; background: var(--accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-top: -24px; box-shadow: 0 4px 20px rgba(232, 201, 109, .4); }

        /* Transaction Items */
        .tx-item { display: flex; align-items: center; gap: 12px; background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 12px; margin-bottom: 10px; cursor: pointer; transition: transform .1s; }
        .tx-item:active { transform: scale(0.98); }
        .tx-icon { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
        .tx-info { flex: 1; min-width: 0; }
        .tx-desc { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .tx-meta { font-size: 11px; color: var(--text3); margin-top: 2px; }
        .tx-amount { font-size: 16px; font-weight: 700; }

        /* Badges */
        .badge { padding: 2px 6px; border-radius: 6px; font-size: 9px; font-weight: 800; text-transform: uppercase; margin-left: 5px; }
        .badge-pending { background: rgba(251, 146, 60, 0.15); color: var(--warning); }
        .badge-overdue { background: rgba(248, 113, 113, 0.15); color: var(--expense); }

        /* Forms & Modals */
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.8); backdrop-filter: blur(8px); z-index: 100; display: flex; align-items: flex-end; opacity: 0; pointer-events: none; transition: .3s; }
        .overlay.open { opacity: 1; pointer-events: all; }
        .modal { width: 100%; background: var(--bg2); border-radius: 24px 24px 0 0; padding: 16px 20px calc(var(--safe-bottom) + 20px); transform: translateY(100%); transition: .35s cubic-bezier(.32,.72,0,1); max-height: 90dvh; overflow-y: auto; }
        .overlay.open .modal { transform: translateY(0); }
        .modal-handle { width: 40px; height: 4px; background: rgba(255,255,255,.1); border-radius: 2px; margin: 0 auto 16px; }
        
        .finput, .fselect { width: 100%; padding: 14px; background: var(--bg3); border: 1px solid var(--border); border-radius: 12px; color: var(--text); font-size: 16px; font-family: inherit; outline: none; margin-bottom: 12px; }
        .flabel { font-size: 11px; font-weight: 700; color: var(--text3); margin-bottom: 6px; display: block; letter-spacing: 1px; }
        .btn-submit { width: 100%; padding: 16px; background: var(--accent); border: none; border-radius: 14px; color: var(--bg); font-size: 16px; font-weight: 700; cursor: pointer; }
        
        .chip-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
        .chip { padding: 8px 16px; border-radius: 20px; border: 1.5px solid var(--border); background: transparent; color: var(--text2); font-size: 13px; font-weight: 600; cursor: pointer; }
        .chip.active { border-color: var(--accent); color: var(--accent); background: rgba(232, 201, 109, 0.1); }

        /* Setup Screen */
        .setup { position: fixed; inset: 0; background: var(--bg); z-index: 200; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px; text-align: center; }
        
        /* Utils */
        .hidden { display: none !important; }
        .toast { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); background: var(--card2); padding: 12px 24px; border-radius: 30px; border: 1px solid var(--border); opacity: 0; transition: .3s; z-index: 300; pointer-events: none; }
        .toast.show { opacity: 1; bottom: 120px; }
    </style>
</head>
<body>

<div id="app">
    <!-- SETUP SCREEN -->
    <div id="setup" class="setup">
        <div style="font-size: 60px; margin-bottom: 20px;">💰</div>
        <h1 style="font-family: 'DM Serif Display'; font-size: 32px; margin-bottom: 10px;">Planeja+</h1>
        <p style="color: var(--text2); margin-bottom: 30px;">Gerencie as finanças da sua família<br>de forma simples e elegante.</p>
        
        <div id="setupList" style="width: 100%; max-width: 300px; margin-bottom: 20px;"></div>
        
        <div style="width: 100%; max-width: 300px;">
            <input type="text" id="setupName" class="finput" placeholder="Nome do membro">
            <button id="btnAddMember" class="btn-submit" style="margin-bottom: 10px;">+ Adicionar Membro</button>
            <button id="btnStartApp" class="btn-submit" style="background: var(--bg3); color: var(--accent);">Começar →</button>
        </div>
    </div>

    <!-- MAIN APP -->
    <div id="mainApp" class="hidden" style="flex-direction: column; height: 100%;">
        <div class="header">
            <div class="header-top">
                <div class="logo">Planeja+ <span id="monthLabel"></span></div>
                <div id="headerAction"></div>
            </div>
            <div class="bal-card">
                <div class="bal-label">Saldo Estimado</div>
                <div id="balVal" class="bal-value">R$ 0,00</div>
                <div class="bal-row">
                    <div class="bal-stat">
                        <div class="bal-stat-label">Receitas</div>
                        <div id="balInc" class="bal-stat-val income">R$ 0</div>
                    </div>
                    <div class="bal-stat">
                        <div class="bal-stat-label">Despesas</div>
                        <div id="balExp" class="bal-stat-val expense">R$ 0</div>
                    </div>
                </div>
            </div>
        </div>

        <main class="main" id="tabContent"></main>

        <nav class="bottom-nav">
            <button class="nav-item active" data-tab="home">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
                Início
            </button>
            <button class="nav-item" data-tab="bills">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                Contas
            </button>
            <button class="nav-item" data-tab="add">
                <div class="nav-fab"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0f1923" stroke-width="3"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></div>
                Lançar
            </button>
            <button class="nav-item" data-tab="goals">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
                Metas
            </button>
            <button class="nav-item" data-tab="reports">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
                Relatórios
            </button>
        </nav>
    </div>
</div>

<!-- TRANSACTION MODAL -->
<div id="txModal" class="overlay">
    <div class="modal">
        <div class="modal-handle"></div>
        <h2 id="modalTitle" class="modal-title" style="margin-bottom: 20px; font-family: 'DM Serif Display';">Editar Lançamento</h2>
        
        <label class="flabel">TIPO</label>
        <div class="chip-row" id="editTypeToggle">
            <button class="chip" data-type="expense">💸 Despesa</button>
            <button class="chip" data-type="income">💰 Receita</button>
        </div>

        <div style="display: flex; gap: 10px;">
            <div style="flex: 1;">
                <label class="flabel">VALOR (R$)</label>
                <input type="number" id="editAmount" class="finput" step="0.01" inputmode="decimal">
            </div>
            <div style="flex: 1;">
                <label class="flabel">DATA</label>
                <input type="date" id="editDate" class="finput">
            </div>
        </div>

        <label class="flabel">DESCRIÇÃO</label>
        <input type="text" id="editDesc" class="finput" placeholder="Ex: Aluguel">

        <div style="display: flex; gap: 10px;">
            <div style="flex: 1;">
                <label class="flabel">CATEGORIA</label>
                <select id="editCat" class="fselect"></select>
            </div>
            <div style="flex: 1;">
                <label class="flabel">RECORRÊNCIA</label>
                <select id="editRec" class="fselect">
                    <option value="once">Único</option>
                    <option value="weekly">Semanal</option>
                    <option value="monthly">Mensal</option>
                    <option value="yearly">Anual</option>
                </select>
            </div>
        </div>

        <div id="expenseOnlyFields">
            <label class="flabel">STATUS</label>
            <select id="editStatus" class="fselect">
                <option value="paid">✅ Pago</option>
                <option value="pending">⏳ A pagar</option>
            </select>
        </div>

        <label class="flabel">MEMBRO</label>
        <div class="chip-row" id="editMemberChips"></div>

        <button id="btnSaveEdit" class="btn-submit">Salvar Alterações</button>
        <button id="btnDeleteTx" class="btn-submit" style="background: rgba(248,113,113,0.1); color: var(--expense); margin-top: 10px;">Excluir Lançamento</button>
        <button id="btnCancelEdit" class="btn-submit" style="background: transparent; color: var(--text3);">Cancelar</button>
    </div>
</div>

<div id="toast" class="toast"></div>

<script>
    // --- CONFIG & STATE ---
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    
    let state = {
        members: [],
        txs: [],
        goals: [],
        currentTab: 'home',
        currentMonth: new Date().getMonth(),
        currentYear: new Date().getFullYear(),
        editingId: null,
        addType: 'expense'
    };

    const COLORS = ['#e8c96d', '#4ade80', '#f87171', '#60a5fa', '#c084fc', '#fb923c'];
    const CATEGORIES = {
        expense: ['Alimentação', 'Transporte', 'Moradia', 'Saúde', 'Lazer', 'Educação', 'Outros'],
        income: ['Salário', 'Freelance', 'Investimentos', 'Presente', 'Outros']
    };
    const MONTHS = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];

    // --- UTILS ---
    const fmtReal = (v) => 'R$ ' + parseFloat(v).toLocaleString('pt-BR', { minimumFractionDigits: 2 });
    const getToday = () => new Date().toISOString().split('T')[0];
    const showToast = (msg) => {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 3000);
    };

    // --- DATA FETCHING ---
    async function loadData() {
        try {
            const [m, t, g] = await Promise.all([
                sb.from('membros').select('*'),
                sb.from('transacoes').select('*'),
                sb.from('metas').select('*')
            ]);
            
            state.members = m.data || [];
            state.txs = (t.data || []).map(tx => ({
                ...tx,
                amount: parseFloat(tx.valor),
                type: tx.tipo,
                desc: tx.descricao,
                memberId: tx.membro_id,
                recurrence: tx.recorrencia
            }));
            state.goals = g.data || [];
            
            return state.members.length > 0;
        } catch (e) {
            console.error("Erro ao carregar dados:", e);
            showToast("Erro de conexão");
            return false;
        }
    }

    // --- RENDERERS ---
    function renderApp() {
        updateBalance();
        const container = document.getElementById('tabContent');
        const action = document.getElementById('headerAction');
        action.innerHTML = '';
        
        document.getElementById('monthLabel').textContent = `${MONTHS[state.currentMonth].substring(0,3)} ${state.currentYear}`;

        if (state.currentTab === 'home') renderHome(container);
        if (state.currentTab === 'bills') renderBills(container);
        if (state.currentTab === 'add') renderAdd(container);
        if (state.currentTab === 'goals') renderGoals(container, action);
        if (state.currentTab === 'reports') renderReports(container);
    }

    function updateBalance() {
        const monthTxs = state.txs.filter(t => {
            const d = new Date(t.data + 'T12:00:00');
            return d.getMonth() === state.currentMonth && d.getFullYear() === state.currentYear;
        });

        const inc = monthTxs.filter(t => t.type === 'income').reduce((a, b) => a + b.amount, 0);
        const exp = monthTxs.filter(t => t.type === 'expense').reduce((a, b) => a + b.amount, 0);
        
        const bal = inc - exp;
        const balEl = document.getElementById('balVal');
        balEl.textContent = fmtReal(bal);
        balEl.className = 'bal-value' + (bal < 0 ? ' neg' : '');
        
        document.getElementById('balInc').textContent = fmtReal(inc);
        document.getElementById('balExp').textContent = fmtReal(exp);
    }

    function renderHome(c) {
        const monthTxs = state.txs.filter(t => {
            const d = new Date(t.data + 'T12:00:00');
            return d.getMonth() === state.currentMonth && d.getFullYear() === state.currentYear;
        }).sort((a,b) => b.data.localeCompare(a.data));

        if (monthTxs.length === 0) {
            c.innerHTML = `<div style="text-align:center; padding:40px; color:var(--text3)">Nenhum lançamento este mês.</div>`;
            return;
        }

        c.innerHTML = monthTxs.map(t => txItemHtml(t)).join('');
    }

    function renderBills(c) {
        const pending = state.txs.filter(t => t.type === 'expense' && t.status === 'pending')
            .sort((a,b) => a.data.localeCompare(b.data));
        
        if (pending.length === 0) {
            c.innerHTML = `<div style="text-align:center; padding:40px; color:var(--text3)">Tudo pago! 🎉</div>`;
            return;
        }

        c.innerHTML = `<h3 class="flabel">CONTAS A PAGAR</h3>` + pending.map(t => txItemHtml(t)).join('');
    }

    function txItemHtml(t) {
        const member = state.members.find(m => m.id == t.memberId);
        const isOverdue = t.status === 'pending' && t.data < getToday();
        const badge = t.status === 'pending' ? `<span class="badge ${isOverdue ? 'badge-overdue' : 'badge-pending'}">${isOverdue ? 'Vencida' : 'Pendente'}</span>` : '';
        
        return `
            <div class="tx-item" onclick="openEditTx('${t.id}')">
                <div class="tx-icon" style="background: ${t.type === 'income' ? 'rgba(74,222,128,0.1)' : 'rgba(248,113,113,0.1)'}">
                    ${t.type === 'income' ? '💰' : '💸'}
                </div>
                <div class="tx-info">
                    <div class="tx-desc">${t.desc} ${badge}</div>
                    <div class="tx-meta">${member ? member.nome : 'Geral'} • ${t.categoria} • ${t.data.split('-').reverse().slice(0,2).join('/')}</div>
                </div>
                <div class="tx-amount ${t.type}">${t.type === 'income' ? '+' : '-'}${fmtReal(t.amount)}</div>
            </div>
        `;
    }

    function renderAdd(c) {
        c.innerHTML = `
            <div style="background: var(--bg2); border-radius: 16px; padding: 20px;">
                <h2 style="margin-bottom: 20px; font-family: 'DM Serif Display';">Novo Lançamento</h2>
                
                <label class="flabel">TIPO</label>
                <div class="chip-row" id="addTypeToggle">
                    <button class="chip ${state.addType === 'expense' ? 'active' : ''}" data-type="expense">💸 Despesa</button>
                    <button class="chip ${state.addType === 'income' ? 'active' : ''}" data-type="income">💰 Receita</button>
                </div>

                <label class="flabel">DESCRIÇÃO</label>
                <input type="text" id="addDesc" class="finput" placeholder="Ex: Mercado">
                
                <div style="display: flex; gap: 10px;">
                    <div style="flex: 1;">
                        <label class="flabel">VALOR (R$)</label>
                        <input type="number" id="addAmount" class="finput" step="0.01" inputmode="decimal">
                    </div>
                    <div style="flex: 1;">
                        <label class="flabel">DATA</label>
                        <input type="date" id="addDate" class="finput" value="${getToday()}">
                    </div>
                </div>

                <label class="flabel">CATEGORIA</label>
                <select id="addCat" class="fselect">
                    ${CATEGORIES[state.addType].map(cat => `<option value="${cat}">${cat}</option>`).join('')}
                </select>

                <label class="flabel">MEMBRO</label>
                <div class="chip-row" id="addMemberChips">
                    ${state.members.map(m => `<button class="chip" data-id="${m.id}">${m.nome}</button>`).join('')}
                </div>

                <button id="btnSaveAdd" class="btn-submit">Salvar Lançamento</button>
            </div>
        `;

        // Event Listeners for Dynamic Form
        c.querySelector('#addTypeToggle').onclick = (e) => {
            if (e.target.dataset.type) {
                state.addType = e.target.dataset.type;
                renderAdd(c);
            }
        };

        let selectedMemberId = state.members[0]?.id;
        c.querySelector('#addMemberChips').onclick = (e) => {
            if (e.target.dataset.id) {
                selectedMemberId = e.target.dataset.id;
                c.querySelectorAll('#addMemberChips .chip').forEach(ch => ch.classList.toggle('active', ch.dataset.id == selectedMemberId));
            }
        };
        c.querySelector('#addMemberChips .chip').classList.add('active');

        c.querySelector('#btnSaveAdd').onclick = async () => {
            const desc = document.getElementById('addDesc').value;
            const amount = document.getElementById('addAmount').value;
            const date = document.getElementById('addDate').value;
            const cat = document.getElementById('addCat').value;

            if (!desc || !amount) { showToast("Preencha tudo"); return; }

            const newTx = {
                tipo: state.addType,
                valor: parseFloat(amount),
                descricao: desc,
                data: date,
                categoria: cat,
                membro_id: selectedMemberId,
                status: state.addType === 'income' ? 'paid' : 'pending'
            };

            const { data, error } = await sb.from('transacoes').insert([newTx]).select();
            if (error) { showToast("Erro ao salvar"); return; }
            
            state.txs.push({...data[0], amount: parseFloat(data[0].valor), type: data[0].tipo, desc: data[0].descricao, memberId: data[0].membro_id});
            showToast("Salvo com sucesso!");
            state.currentTab = 'home';
            renderApp();
            document.querySelectorAll('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.tab === 'home'));
        };
    }

    function renderGoals(c, action) {
        action.innerHTML = `<button class="chip active" onclick="showToast('Em breve: Novas Metas')">+ Meta</button>`;
        if (state.goals.length === 0) {
            c.innerHTML = `<div style="text-align:center; padding:40px; color:var(--text3)">Nenhuma meta definida.</div>`;
            return;
        }
        c.innerHTML = state.goals.map(g => `
            <div class="tx-item">
                <div class="tx-icon" style="background: rgba(232, 201, 109, 0.1)">🎯</div>
                <div class="tx-info">
                    <div class="tx-desc">${g.nome}</div>
                    <div class="tx-meta">Progresso: ${fmtReal(g.valor_atual)} de ${fmtReal(g.valor_alvo)}</div>
                    <div style="height:4px; background:var(--bg3); border-radius:2px; margin-top:8px;">
                        <div style="height:100%; width:${Math.min(100, (g.valor_atual/g.valor_alvo)*100)}%; background:var(--accent); border-radius:2px;"></div>
                    </div>
                </div>
            </div>
        `).join('');
    }

    function renderReports(c) {
        c.innerHTML = `
            <div style="background: var(--bg2); border-radius: 16px; padding: 20px; margin-bottom: 20px;">
                <h3 class="flabel">EXPORTAÇÃO</h3>
                <button class="btn-submit" id="btnExport" style="background: var(--bg3); color: var(--accent);">📊 Baixar Excel (.xlsx)</button>
            </div>
        `;
        document.getElementById('btnExport').onclick = () => {
            const data = state.txs.map(t => ({
                Data: t.data,
                Tipo: t.type === 'income' ? 'Receita' : 'Despesa',
                Descricao: t.desc,
                Valor: t.amount,
                Categoria: t.categoria,
                Status: t.status === 'paid' ? 'Pago' : 'Pendente'
            }));
            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Transacoes");
            XLSX.writeFile(wb, "PlanejaPlus_Export.xlsx");
        };
    }

    // --- EDIT MODAL LOGIC ---
    function openEditTx(id) {
        const t = state.txs.find(x => x.id == id);
        if (!t) return;
        state.editingId = id;
        
        document.getElementById('editAmount').value = t.amount;
        document.getElementById('editDate').value = t.data;
        document.getElementById('editDesc').value = t.desc;
        document.getElementById('editRec').value = t.recurrence || 'once';
        document.getElementById('editStatus').value = t.status || 'paid';
        
        const catSelect = document.getElementById('editCat');
        catSelect.innerHTML = CATEGORIES[t.type].map(c => `<option value="${c}" ${c === t.categoria ? 'selected' : ''}>${c}</option>`).join('');
        
        document.getElementById('expenseOnlyFields').classList.toggle('hidden', t.type === 'income');
        
        renderEditMemberChips(t.memberId);
        document.getElementById('txModal').classList.add('open');
    }

    function renderEditMemberChips(selectedId) {
        const container = document.getElementById('editMemberChips');
        container.innerHTML = state.members.map(m => `
            <button class="chip ${m.id == selectedId ? 'active' : ''}" data-id="${m.id}">${m.nome}</button>
        `).join('');
        container.onclick = (e) => {
            if (e.target.dataset.id) {
                container.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c.dataset.id == e.target.dataset.id));
            }
        };
    }

    // --- SETUP LOGIC ---
    document.getElementById('btnAddMember').onclick = async () => {
        const name = document.getElementById('setupName').value.trim();
        if (!name) return;
        
        const color = COLORS[state.members.length % COLORS.length];
        const { data, error } = await sb.from('membros').insert([{ nome: name, cor: color }]).select();
        
        if (error) { showToast("Erro ao adicionar"); return; }
        
        state.members.push(data[0]);
        renderSetupList();
        document.getElementById('setupName').value = '';
    };

    function renderSetupList() {
        document.getElementById('setupList').innerHTML = state.members.map(m => `
            <div style="display:flex; align-items:center; gap:10px; background:var(--bg2); padding:10px; border-radius:12px; margin-bottom:8px;">
                <div style="width:12px; height:12px; border-radius:50%; background:${m.cor}"></div>
                <span style="flex:1">${m.nome}</span>
            </div>
        `).join('');
    }

    document.getElementById('btnStartApp').onclick = () => {
        if (state.members.length === 0) { showToast("Adicione um membro"); return; }
        document.getElementById('setup').classList.add('hidden');
        document.getElementById('mainApp').classList.remove('hidden');
        renderApp();
    };

    // --- APP LIFECYCLE ---
    document.querySelectorAll('.nav-item').forEach(item => {
        item.onclick = () => {
            state.currentTab = item.dataset.tab;
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            item.classList.add('active');
            renderApp();
        };
    });

    document.getElementById('btnCancelEdit').onclick = () => document.getElementById('txModal').classList.remove('open');

    document.getElementById('btnSaveEdit').onclick = async () => {
        const upd = {
            valor: parseFloat(document.getElementById('editAmount').value),
            data: document.getElementById('editDate').value,
            descricao: document.getElementById('editDesc').value,
            categoria: document.getElementById('editCat').value,
            recorrencia: document.getElementById('editRec').value,
            status: document.getElementById('editStatus').value,
            membro_id: document.querySelector('#editMemberChips .chip.active').dataset.id
        };

        const { error } = await sb.from('transacoes').update(upd).eq('id', state.editingId);
        if (error) { showToast("Erro ao atualizar"); return; }

        const idx = state.txs.findIndex(x => x.id == state.editingId);
        state.txs[idx] = { ...state.txs[idx], ...upd, amount: upd.valor, desc: upd.descricao, memberId: upd.membro_id };
        
        document.getElementById('txModal').classList.remove('open');
        showToast("Atualizado!");
        renderApp();
    };

    document.getElementById('btnDeleteTx').onclick = async () => {
        if (!confirm("Excluir este lançamento?")) return;
        const { error } = await sb.from('transacoes').delete().eq('id', state.editingId);
        if (error) { showToast("Erro ao excluir"); return; }
        
        state.txs = state.txs.filter(x => x.id != state.editingId);
        document.getElementById('txModal').classList.remove('open');
        showToast("Excluído");
        renderApp();
    };

    window.onload = async () => {
        const hasMembers = await loadData();
        if (hasMembers) {
            document.getElementById('setup').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('hidden');
            renderApp();
        } else {
            renderSetupList();
        }
    };

    // Service Worker Registration
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('service-worker.js').catch(console.error);
    }
</script>

</body>
</html>
